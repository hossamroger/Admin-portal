server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  datasource:
    # ===== Supply these three env vars before starting =====
    #   DB_URL       e.g. jdbc:oracle:thin:@host:1521:sid
    #   DB_USERNAME  e.g. BPM_DATA
    #   DB_PASSWORD  your DB password
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: dbexplorer-pool

dbexplorer:
  # Schema (owner) to introspect. Leave empty to use the connection user's own schema.
  default-schema: ""
  # When true, only SELECT statements are allowed; all INSERT/UPDATE/DELETE/DDL are blocked.
  read-only: false
  # Max rows returned by a single query / data-browse request.
  max-rows: 1000
  # Statement timeout in seconds (0 = no timeout).
  query-timeout-seconds: 60

  auth:
    enabled: true            # set false to disable login entirely (open mode)
    # Passwords: use "{noop}plain" for quick testing, or a BCrypt hash for real use
    # (generate one and store it as "{bcrypt}$2a$..." or just "$2a$...").
    # Privileges: SELECT, INSERT, UPDATE, DELETE, EXECUTE_SQL
    # allowed-tables: whitelist of table/view names; leave empty = sees everything.
    # Users are now managed in the database (DBX_USERS table).
    # A default admin account is created on the first run with a randomly generated
    # BCrypt-hashed password printed once to stdout. Change it after first login.
    users: []

  # Firebase / Google Cloud Storage — credentials are NEVER stored in this file.
  # Set these two environment variables before starting the application:
  #   GOOGLE_APPLICATION_CREDENTIALS  → absolute path to your service-account JSON on the local machine
  #   FIREBASE_STORAGE_BUCKET         → your bucket name, e.g. my-project.appspot.com
  firebase:
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}

  # Audit log — records every action asynchronously (never slows a request).
  audit:
    enabled: true
    auto-create-table: true   # create DBX_AUDIT_LOG on startup if missing
    log-reads: true           # set false to log only data-changing actions
    queue-capacity: 10000     # in-memory buffer; events beyond this are dropped, not queued
    batch-size: 500           # rows per background insert
    table: DBX_AUDIT_LOG

logging:
  level:
    com.example.dbexplorer: INFO
    org.apache.catalina.connector.ClientAbortException: OFF
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: OFF
