<div class="pf-page">

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" class="pf-top-bar" />
  }

  <!-- Toolbar -->
  <div class="pf-toolbar">
    <button mat-icon-button matTooltip="Back to list" (click)="back()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2 class="pf-heading">
      {{ isNew() ? 'New Payment Code' : payCode().processCode }}
    </h2>
    @if (dirty()) {
      <span class="pf-dirty-badge">Unsaved changes</span>
    }
    <span class="pf-spacer"></span>
    @if (!isNew()) {
      <button mat-stroked-button color="warn" (click)="delete()" [disabled]="saving()">
        <mat-icon>delete_outline</mat-icon> Delete
      </button>
    }
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving() || loading()">
      <mat-icon>save</mat-icon>
      {{ saving() ? 'Saving…' : (isNew() ? 'Create' : 'Save') }}
    </button>
  </div>

  <div class="pf-body">

    <!-- ── Section 1: LKP_PAY_CODE (Master) ──────────────────────────────── -->
    <section class="pf-card">
      <div class="pf-card-header">
        <mat-icon>payments</mat-icon>
        <span>Pay Code</span>
      </div>
      <div class="pf-card-body">
        <div class="pf-grid">

          <div class="pf-field">
            <label class="pf-label">Process Code <span class="req">*</span></label>
            <input class="pf-input" [value]="payCode().processCode"
                   (input)="setPayCode('processCode', $any($event.target).value)"
                   [readonly]="!isNew()" placeholder="e.g. PC-001">
          </div>

          <div class="pf-field">
            <label class="pf-label">Process Identifier</label>
            <input class="pf-input" [value]="payCode().processIdentifier ?? ''"
                   (input)="setPayCode('processIdentifier', $any($event.target).value || null)"
                   placeholder="Optional identifier">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Code <span class="req">*</span></label>
            <input class="pf-input" [value]="payCode().entityCode"
                   (input)="setPayCode('entityCode', $any($event.target).value)"
                   placeholder="e.g. ENT-01">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Department Code <span class="req">*</span></label>
            <input class="pf-input" [value]="payCode().entityDepartmentCode"
                   (input)="setPayCode('entityDepartmentCode', $any($event.target).value)"
                   placeholder="Department code">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Service Category Code <span class="req">*</span></label>
            <input class="pf-input" [value]="payCode().entityServiceCategoryCode"
                   (input)="setPayCode('entityServiceCategoryCode', $any($event.target).value)"
                   placeholder="Service category code">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Service Code <span class="req">*</span></label>
            <input class="pf-input" [value]="payCode().entityServiceCode"
                   (input)="setPayCode('entityServiceCode', $any($event.target).value)"
                   placeholder="Service code">
          </div>

        </div>
      </div>
    </section>

    <!-- ── Section 2: LKP_PAY_CODE_DETAILS (one-to-one) ─────────────────── -->
    <section class="pf-card">
      <div class="pf-card-header">
        <mat-icon>list_alt</mat-icon>
        <span>Pay Code Details</span>
        <span class="pf-hint">Joined on all 5 FK columns — one record per pay code</span>
      </div>
      <div class="pf-card-body">
        <div class="pf-grid">

          <div class="pf-field">
            <label class="pf-label">Service Description (AR) <span class="req">*</span></label>
            <input class="pf-input rtl" [value]="details().serviceDescAr"
                   (input)="setDetails('serviceDescAr', $any($event.target).value)"
                   placeholder="وصف الخدمة">
          </div>

          <div class="pf-field">
            <label class="pf-label">Service Description (EN)</label>
            <input class="pf-input" [value]="details().serviceDescEn ?? ''"
                   (input)="setDetails('serviceDescEn', $any($event.target).value || null)"
                   placeholder="Service description">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Name (AR)</label>
            <input class="pf-input rtl" [value]="details().entityNameAr ?? ''"
                   (input)="setDetails('entityNameAr', $any($event.target).value || null)"
                   placeholder="اسم الجهة">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Name (EN)</label>
            <input class="pf-input" [value]="details().entityNameEn ?? ''"
                   (input)="setDetails('entityNameEn', $any($event.target).value || null)"
                   placeholder="Entity name">
          </div>

          <div class="pf-field">
            <label class="pf-label">Entity Code</label>
            <select class="pf-select"
                    (change)="setDetails('entityCode', $any($event.target).value || null)">
              <option value="" [selected]="!details().entityCode">— Select —</option>
              @for (e of entities(); track e.entityCode) {
                <option [value]="e.entityCode" [selected]="details().entityCode === e.entityCode">
                  {{ e.entityCode }}{{ e.entityNameEn ? ' — ' + e.entityNameEn : '' }}
                </option>
              }
            </select>
          </div>

        </div>
      </div>
    </section>

  </div>
</div>
