<div class="login-wrap">
  <mat-card class="login-card" appearance="outlined">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-name">DS Admin Portal</span>
    </div>
    <p class="subtitle">Sign in to continue</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" autofocus>
        <mat-icon matPrefix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput [type]="showPass() ? 'text' : 'password'" formControlName="password" autocomplete="current-password">
        <mat-icon matPrefix>lock</mat-icon>
        <button mat-icon-button matSuffix type="button" (click)="showPass.set(!showPass())" [attr.aria-label]="showPass() ? 'Hide password' : 'Show password'">
          <mat-icon>{{ showPass() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      @if (loading()) { <mat-progress-bar mode="indeterminate" /> }

      <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>

      <p class="session-hint">
        <mat-icon>schedule</mat-icon>
        Session expires after 30 minutes of inactivity
      </p>
    </form>
  </mat-card>
</div>
