<div class="hbf-page">

  <div class="hbf-header">
    <button mat-icon-button (click)="back()" matTooltip="Back to list">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="hbf-title">{{ title() }}</h1>
  </div>

  @if (loading()) { <mat-progress-bar mode="indeterminate" /> }

  <div class="form-grid">

    <!-- Row 1: URL + URL_SM -->
    <div class="field-group span-2">
      <label class="field-label">URL</label>
      <input class="field-input" [value]="dto().url || ''"
             (input)="set('url', $any($event.target).value)" placeholder="https://…">
    </div>

    <div class="field-group span-2">
      <label class="field-label">URL (Small)</label>
      <input class="field-input" [value]="dto().urlSm || ''"
             (input)="set('urlSm', $any($event.target).value)" placeholder="https://… (small variant)">
    </div>

    <!-- Platform / Language / Min Version -->
    <div class="field-group">
      <label class="field-label">Platform</label>
      <input class="field-input" [value]="dto().platform || ''"
             (input)="set('platform', $any($event.target).value)" placeholder="e.g. IOS, ANDROID, WEB">
    </div>

    <div class="field-group">
      <label class="field-label">Language</label>
      <input class="field-input" [value]="dto().language || ''"
             (input)="set('language', $any($event.target).value)" placeholder="e.g. AR, EN">
    </div>

    <div class="field-group">
      <label class="field-label">Min Version</label>
      <input class="field-input mono" [value]="dto().minVersion || ''"
             (input)="set('minVersion', $any($event.target).value)" placeholder="e.g. 2.0.0">
    </div>

    <div class="field-group">
      <label class="field-label">Banner Order</label>
      <input class="field-input mono" type="number" [value]="dto().bannerOrder ?? ''"
             (input)="set('bannerOrder', +$any($event.target).value || null)">
    </div>

    <!-- Dates -->
    <div class="field-group">
      <label class="field-label">Start Date</label>
      <input class="field-input mono" type="date" [value]="dto().startDt || ''"
             (input)="set('startDt', $any($event.target).value)">
    </div>

    <div class="field-group">
      <label class="field-label">Expiry Date</label>
      <input class="field-input mono" type="date" [value]="dto().expiryDt || ''"
             (input)="set('expiryDt', $any($event.target).value)">
    </div>

    <!-- Colors -->
    <div class="field-group">
      <label class="field-label">Foreground Color</label>
      <input class="field-input mono" [value]="dto().foreColor || ''"
             (input)="set('foreColor', $any($event.target).value)" placeholder="#FFFFFF">
    </div>

    <div class="field-group">
      <label class="field-label">Background Color</label>
      <input class="field-input mono" [value]="dto().bgColor || ''"
             (input)="set('bgColor', $any($event.target).value)" placeholder="#000000">
    </div>

    <div class="field-group">
      <label class="field-label">Main Title Color</label>
      <input class="field-input mono" [value]="dto().mainTitleColor || ''"
             (input)="set('mainTitleColor', $any($event.target).value)" placeholder="#000000">
    </div>

    <div class="field-group">
      <label class="field-label">Extension Type</label>
      <input class="field-input" [value]="dto().extensionType || ''"
             (input)="set('extensionType', $any($event.target).value)">
    </div>

    <!-- Action fields -->
    <div class="field-group">
      <label class="field-label">Action Type</label>
      <input class="field-input" [value]="dto().actionType || ''"
             (input)="set('actionType', $any($event.target).value)">
    </div>

    <div class="field-group">
      <label class="field-label">Action Code</label>
      <input class="field-input mono" [value]="dto().actionCode || ''"
             (input)="set('actionCode', $any($event.target).value)">
    </div>

    <div class="field-group span-2">
      <label class="field-label">Action URL</label>
      <input class="field-input" [value]="dto().actionUrl || ''"
             (input)="set('actionUrl', $any($event.target).value)" placeholder="https://…">
    </div>

    <div class="field-group">
      <label class="field-label">Catalog ID</label>
      <input class="field-input mono" [value]="dto().catalogId || ''"
             (input)="set('catalogId', $any($event.target).value)">
    </div>

    <!-- Flags -->
    <div class="field-group span-2">
      <label class="field-label">Flags</label>
      <div class="flag-row">
        <label class="flag-item">
          <input type="checkbox" [checked]="dto().isActive === 1"
                 (change)="setFlag('isActive', $any($event.target).checked)">
          <span>Active</span>
        </label>
        <label class="flag-item">
          <input type="checkbox" [checked]="dto().hasAction === 1"
                 (change)="setFlag('hasAction', $any($event.target).checked)">
          <span>Has Action</span>
        </label>
        <label class="flag-item">
          <input type="checkbox" [checked]="dto().isHeadline === 1"
                 (change)="setFlag('isHeadline', $any($event.target).checked)">
          <span>Headline</span>
        </label>
        <label class="flag-item">
          <input type="checkbox" [checked]="dto().isDarkMode === 1"
                 (change)="setFlag('isDarkMode', $any($event.target).checked)">
          <span>Dark Mode</span>
        </label>
      </div>
    </div>

    <!-- Read-only timestamps (edit mode only) -->
    @if (!isNew()) {
      <div class="field-group">
        <label class="field-label">Created At</label>
        <input class="field-input mono" [value]="dto().createdAt || '—'" disabled>
      </div>
      <div class="field-group">
        <label class="field-label">Updated At</label>
        <input class="field-input mono" [value]="dto().updatedAt || '—'" disabled>
      </div>
    }

  </div>

  <div class="form-actions">
    <button mat-flat-button color="primary" (click)="save()" [disabled]="saving()">
      <mat-icon>save</mat-icon> {{ isNew() ? 'Create Banner' : 'Save Banner' }}
    </button>
  </div>

</div>
